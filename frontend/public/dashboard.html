<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskForge · Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- HEADER DASHBOARD -->
    <!-- HEADER DASHBOARD - CORRIGIDO -->
    <header class="dashboard-header">
        <div class="header-content">
            <a href="index.html" class="logo-container" aria-label="TaskForge - Dashboard">
                <img src="assets/Taskgorge_logo1.webp" alt="TaskForge Logo" class="logo-img" width="120" height="32">
            </a>

            <!-- Menu Mobile -->
            <button class="mobile-menu-btn" id="menuBtn" aria-label="Menu">
                <i class="fas fa-bars"></i>
            </button>

            <!-- Navegação Desktop -->
            <nav class="nav-dashboard" id="navDashboard">
                <div class="nav-user">
                    <!-- NOTIFICAÇÕES -->
                    <div class="notifications-wrapper">
                        <div class="notifications" id="notificationsBtn">
                            <i class="far fa-bell"></i>
                            <span class="notification-badge" style="display: none;">0</span>
                        </div>

                        <!-- Dropdown Notificações (FORA do botão, mas controlado por ele) -->
                        <div class="notifications-dropdown" id="notificationsDropdown">
                            <div class="notifications-header">
                                <h3>Notificações</h3>
                                <button class="btn btn-sm btn-outline" id="markAllRead">Marcar todas</button>
                            </div>
                            <div class="notifications-list" id="notificationsList">
                                <div class="empty-notifications">Nenhuma notificação</div>
                            </div>
                        </div>
                    </div>

                    <!-- USUÁRIO -->
                    <div class="user-wrapper">
                        <div class="user-menu" id="userMenu">
                            <img src="" alt="Avatar" class="user-avatar" id="userAvatar">
                            <div class="user-info">
                                <span class="user-name" id="userName"></span>
                                <span class="user-email" id="userEmail"></span>
                            </div>
                            <i class="fas fa-chevron-down"></i>
                        </div>

                        <!-- Dropdown do Usuário (FORA do botão) -->
                        <div class="user-dropdown" id="userDropdown">
                            <a href="#profile"><i class="fas fa-user"></i> Perfil</a>
                            <a href="#settings"><i class="fas fa-cog"></i> Configurações</a>
                            <hr>
                            <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sair</a>
                        </div>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <!-- DASHBOARD PRINCIPAL -->
    <main class="dashboard">
        <div class="dashboard-container">
            <!-- Cabeçalho do Dashboard -->
            <div class="dashboard-header-content">
                <div>
                    <h1>Meus Projetos</h1>
                    <p class="dashboard-subtitle">Gerencie seus boards e forje produtividade</p>
                </div>
                <button class="btn btn-primary" id="createProjectBtn">
                    <i class="fas fa-plus"></i>
                    <span class="btn-text">Novo Projeto</span>
                </button>
            </div>

            <!-- Loading State -->
            <div class="loading-container" id="loading" style="display: none;">
                <div class="loading"></div>
            </div>

            <!-- Grid de Projetos -->
            <div class="projects-grid" id="projectsContainer">
                <!-- Cards serão inseridos via JavaScript -->
            </div>
        </div>
    </main>

    <!-- MODAL CRIAR PROJETO -->
    <div class="modal" id="createProjectModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-plus-circle" style="color: var(--primary-blue);"></i> Criar Novo Projeto</h2>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>

            <form class="project-form" onsubmit="event.preventDefault(); dashboard.createProject();">
                <div class="form-group">
                    <label for="projectName">Nome do projeto <span class="required">*</span></label>
                    <input type="text" id="projectName" placeholder="Ex: Marketing 2026, App Mobile..." required
                        maxlength="100">
                </div>

                <div class="form-group">
                    <label for="projectDescription">Descrição <span class="optional">(opcional)</span></label>
                    <textarea id="projectDescription" placeholder="Descreva o objetivo do projeto..."
                        rows="4"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="dashboard.closeModals()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="saveProjectBtn">
                        <i class="fas fa-check"></i> Criar Projeto
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- TEMPLATE CARD PROJETO -->
    <template id="projectCardTemplate">
        <div class="project-card">
            <div class="project-card-header">
                <div class="project-icon"></div>
                <div class="project-actions">
                    <button class="btn-delete" title="Deletar projeto">
                        <i class="fas fa-trash"></i>
                        <span class="btn-delete-text">Deletar</span>
                    </button>
                </div>
            </div>
            <div class="project-card-body">
                <h3 class="project-title"></h3>
                <p class="project-description"></p>
            </div>
            <div class="project-card-footer">
                <div class="project-meta">
                    <div class="project-owner">
                        <img src="" alt="Owner" class="owner-avatar">
                        <span class="owner-name"></span>
                    </div>
                    <div class="project-stats">
                        <div class="stat stat-todo">
                            <i class="far fa-circle"></i>
                            <span>0</span>
                        </div>
                        <div class="stat stat-doing">
                            <i class="fas fa-spinner"></i>
                            <span>0</span>
                        </div>
                        <div class="stat stat-done">
                            <i class="fas fa-check-circle"></i>
                            <span>0</span>
                        </div>
                    </div>
                </div>
                <div class="members-avatars"></div>
            </div>
        </div>
    </template>

    <script src="js/config/page-loader.js"></script>
</body>

</html>
