<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskForge · Projeto</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/project.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="project-page">
        <!-- HEADER DASHBOARD (com botão voltar) -->
        <!-- HEADER DASHBOARD (com botão voltar) - VERSÃO CORRIGIDA -->
        <header class="dashboard-header">
            <div class="header-content">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="btn btn-outline btn-sm" id="backBtn" aria-label="Voltar">
                        <i class="fas fa-arrow-left"></i>
                        <span class="back-text">Voltar</span>
                    </button>
                    <a href="dashboard.html" class="logo-container" aria-label="TaskForge - Dashboard">
                        <img src="assets/Taskgorge_logo1.webp" alt="TaskForge Logo" class="logo-img" width="120"
                            height="32">
                    </a>
                </div>

                <!-- Menu Mobile -->
                <button class="mobile-menu-btn" id="menuBtn" aria-label="Menu">
                    <i class="fas fa-bars"></i>
                </button>

                <!-- Navegação Desktop -->
                <nav class="nav-dashboard" id="navDashboard">
                    <div class="nav-user">
                        <!-- NOTIFICAÇÕES - ESTRUTURA CORRETA COM WRAPPER -->
                        <div class="notifications-wrapper">
                            <div class="notifications" id="notificationsBtn">
                                <i class="far fa-bell"></i>
                                <span class="notification-badge" style="display: none;">0</span>
                            </div>

                            <!-- Dropdown Notificações (FORA do botão) -->
                            <div class="notifications-dropdown" id="notificationsDropdown">
                                <div class="notifications-header">
                                    <h3>Notificações</h3>
                                    <button class="btn btn-sm btn-outline" id="markAllRead">Marcar todas</button>
                                </div>
                                <div class="notifications-list" id="notificationsList">
                                    <div class="empty-notifications">Nenhuma notificação</div>
                                </div>
                            </div>
                        </div>

                        <!-- USUÁRIO - ESTRUTURA CORRETA COM WRAPPER -->
                        <div class="user-wrapper">
                            <div class="user-menu" id="userMenu">
                                <img src="" alt="Avatar" class="user-avatar" id="userAvatar">
                                <div class="user-info">
                                    <span class="user-name" id="userName"></span>
                                    <span class="user-email" id="userEmail"></span>
                                </div>
                                <i class="fas fa-chevron-down"></i>
                            </div>

                            <!-- Dropdown do Usuário (FORA do botão) -->
                            <div class="user-dropdown" id="userDropdown">
                                <a href="#profile"><i class="fas fa-user"></i> Perfil</a>
                                <a href="#settings"><i class="fas fa-cog"></i> Configurações</a>
                                <hr>
                                <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sair</a>
                            </div>
                        </div>
                    </div>
                </nav>
            </div>
        </header>

        <!-- Project Header -->
        <header class="project-header">
            <div class="project-info">
                <div>
                    <h1 id="projectName">Carregando...</h1>
                    <p class="description" id="projectDescription"></p>

                    <div class="project-meta">
                        <div class="meta-item">
                            <i class="fas fa-user"></i>
                            <span id="projectOwner"></span>
                        </div>
                        <div class="meta-item">
                            <i class="far fa-calendar"></i>
                            <span id="projectCreated"></span>
                        </div>
                        <div class="members-list" id="membersList"></div>
                        <button class="add-member" id="inviteMemberBtn" title="Convidar membro">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>

                <button class="btn btn-primary" id="addTaskBtn">
                    <i class="fas fa-plus"></i>
                    Nova Tarefa
                </button>
            </div>
        </header>

        <!-- Kanban Board -->
        <div class="kanban-board">
            <!-- Coluna To Do -->
            <div class="kanban-column" data-status="todo">
                <div class="column-header">
                    <h2>
                        📌 A Fazer
                        <span class="count" id="todoCount">0</span>
                    </h2>
                    <div class="add-task" onclick="window.projectPage.showTaskModal()">
                        <i class="fas fa-plus"></i>
                    </div>
                </div>
                <div class="tasks-container" id="todoContainer"></div>
            </div>

            <!-- Coluna Doing -->
            <div class="kanban-column" data-status="doing">
                <div class="column-header">
                    <h2>
                        ⚙️ Fazendo
                        <span class="count" id="doingCount">0</span>
                    </h2>
                </div>
                <div class="tasks-container" id="doingContainer"></div>
            </div>

            <!-- Coluna Done -->
            <div class="kanban-column" data-status="done">
                <div class="column-header">
                    <h2>
                        ✅ Pronto
                        <span class="count" id="doneCount">0</span>
                    </h2>
                </div>
                <div class="tasks-container" id="doneContainer"></div>
            </div>
        </div>
    </div>

    <!-- Modal Tarefa -->
    <div class="modal" id="taskModal">
        <div class="modal-content task-modal">
            <div class="modal-header">
                <h3><i class="fas fa-tasks" style="color: var(--primary-blue);"></i> <span id="taskModalTitle">Nova
                        Tarefa</span></h3>
                <button class="modal-close" id="closeTaskModal">&times;</button>
            </div>

            <form id="taskForm" onsubmit="event.preventDefault(); window.projectPage.saveTask();">
                <input type="hidden" id="taskId">

                <div class="form-group">
                    <label for="taskTitle">Título da tarefa <span class="required">*</span></label>
                    <input type="text" id="taskTitle" placeholder="Ex: Revisar documentação" required>
                </div>

                <div class="form-group">
                    <label for="taskDescription">Descrição <span class="optional">(opcional)</span></label>
                    <textarea id="taskDescription" placeholder="Descreva os detalhes da tarefa..." rows="3"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskPriority">Prioridade</label>
                        <select id="taskPriority">
                            <option value="low">🔵 Baixa</option>
                            <option value="medium" selected>🟡 Média</option>
                            <option value="high">🟠 Alta</option>
                            <option value="urgent">🔴 Urgente</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskDueDate">Data de vencimento</label>
                        <input type="date" id="taskDueDate">
                    </div>
                </div>

                <div class="form-group">
                    <label for="taskAssignee">Responsável</label>
                    <select id="taskAssignee">
                        <option value="">Não atribuir</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-outline"
                        onclick="window.projectPage.closeModals()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="saveTaskBtn">
                        <i class="fas fa-check"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Convidar Membro -->
    <div class="modal" id="inviteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-user-plus" style="color: var(--primary-blue);"></i> Convidar Membro</h3>
                <button class="modal-close" id="closeInviteModal">&times;</button>
            </div>

            <form onsubmit="event.preventDefault(); window.projectPage.inviteMember();">
                <div class="form-group">
                    <label for="inviteEmail">Email do membro <span class="required">*</span></label>
                    <input type="email" id="inviteEmail" placeholder="exemplo@email.com" required>
                </div>

                <div class="form-group">
                    <label for="inviteRole">Papel</label>
                    <select id="inviteRole">
                        <option value="member">👤 Membro</option>
                        <option value="admin">👑 Administrador</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-outline"
                        onclick="window.projectPage.closeModals()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="sendInviteBtn">
                        <i class="fas fa-paper-plane"></i> Convidar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config/page-loader.js"></script>
</body>

</html>
